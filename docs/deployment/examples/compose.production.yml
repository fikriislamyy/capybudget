name: capybudget

x-common: &common
  restart: unless-stopped
  init: true
  networks: [app]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-api: &api
  <<: *common
  image: capybudget-api:${APP_RELEASE:?Set APP_RELEASE}
  build:
    context: ../../..
    dockerfile: docs/deployment/examples/Dockerfile
    target: api
  env_file: [/opt/capybudget/secrets/production.env]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    object-storage: {condition: service_started}

services:
  postgres:
    <<: *common
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: capybudget
      POSTGRES_DB: capybudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U capybudget -d capybudget"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    <<: *common
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12
  object-storage:
    <<: *common
    image: ${SEAWEED_IMAGE:?Set a tested SeaweedFS image tag or digest}
    command: [server, -dir=/data, -s3, -s3.config=/etc/seaweedfs/s3.json, -master.volumeSizeLimitMB=1024, -volume.max=20]
    volumes:
      - object_data:/data
      - /opt/capybudget/secrets/s3.json:/etc/seaweedfs/s3.json:ro
      - ./filer.toml:/etc/seaweedfs/filer.toml:ro
  api:
    <<: *api
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:3000/api/health');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  email-worker:
    <<: *api
    command: [bun, src/email/worker.ts]
  tracking-worker:
    <<: *api
    command: [bun, src/tracking/worker.ts]
  assistant-worker:
    <<: *api
    command: [bun, src/assistant/worker.ts]
  reports-worker:
    <<: *api
    command: [bun, src/reports/worker.ts]
  privacy-worker:
    <<: *api
    command: [bun, src/privacy/worker.ts]
  web:
    <<: *common
    image: capybudget-web:${APP_RELEASE:?Set APP_RELEASE}
    build:
      context: ../../..
      dockerfile: docs/deployment/examples/Dockerfile
      target: web
    environment:
      ORIGIN: https://capybudget.bebem.my.id
      PUBLIC_APP_URL: https://capybudget.bebem.my.id
      PUBLIC_API_URL: https://capybudget.bebem.my.id
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  backup:
    <<: *common
    image: capybudget-backup:${APP_RELEASE:?Set APP_RELEASE}
    build:
      context: ../../..
      dockerfile: docs/deployment/examples/Dockerfile
      target: backup
    env_file: [/opt/capybudget/secrets/production.env]
    environment:
      BACKUP_POSTGRES_LOCAL: "1"
    depends_on:
      postgres: {condition: service_healthy}
      object-storage: {condition: service_started}
  caddy:
    <<: *common
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app: {ipv4_address: 172.30.0.2}
    depends_on:
      web: {condition: service_healthy}

networks:
  app:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
volumes:
  postgres_data:
  redis_data:
  object_data:
  caddy_data:
  caddy_config:
