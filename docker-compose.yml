services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: capybudget
      POSTGRES_USER: capybudget
      POSTGRES_PASSWORD: capybudget
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capybudget -d capybudget"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]
  object-storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-capybudget}
    ports: ["8333:8333"]
    volumes: ["seaweedfs_data:/data"]
  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://capybudget:capybudget@postgres:5432/capybudget
      S3_ENDPOINT: http://object-storage:8333
      BACKUP_S3_ENDPOINT: http://object-storage:8333
      BACKUP_S3_BUCKET: capybudget-backups
      BACKUP_POSTGRES_LOCAL: "1"
      BACKUP_ENVIRONMENT_ID: local
    depends_on:
      postgres: { condition: service_healthy }
      object-storage: { condition: service_started }
volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
