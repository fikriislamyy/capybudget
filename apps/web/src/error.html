<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>%sveltekit.status% · CapyBudget</title>
  <style>
    :root{color-scheme:light;--bg:#FFF8EC;--surface:#F3E6CF;--text:#3B2A1E;--brand:#8A5F3A;--border:#B98B5E}
    :root.dark{color-scheme:dark;--bg:#2A211B;--surface:#372C24;--text:#FFF1DC;--brand:#FFF1DC;--border:#B98B5E}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px 16px}
    main{max-width:480px;width:100%;text-align:center;background:var(--surface);border:2px solid var(--border);border-radius:20px;padding:32px 24px;box-shadow:0 8px 24px #8A5F3A18}h1{font-size:28px;color:var(--brand)}p{line-height:1.7}strong{font-size:36px;font-variant-numeric:tabular-nums;color:var(--brand)}.brand{font-size:20px;color:var(--brand)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}button,a{min-height:44px;padding:12px 24px;border:2px solid var(--border);border-radius:9999px;font:inherit;color:var(--text);background:var(--bg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:4px}
  </style>
  <script>try{if(localStorage.getItem('capybudget-theme')==='dark')document.documentElement.classList.add('dark')}catch{}</script>
</head>
<body>
  <main>
    <p class="brand">CapyBudget</p>
    <strong>%sveltekit.status%</strong>
    <h1>A small bump in the pond</h1>
    <p>We could not load this page right now. Give it another moment, then try again.</p>
    <div class="actions"><button type="button" onclick="location.reload()">Try again</button><a href="/">Back home</a></div>
  </main>
</body>
</html>
